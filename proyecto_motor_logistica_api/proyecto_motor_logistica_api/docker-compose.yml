# Las contraseñas y los identificadores NO van aquí: se leen del archivo .env
# (copia .env.example como .env y completa los valores).
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD. Copia .env.example como .env y define la contraseña}
      POSTGRES_DB: ${POSTGRES_DB:-almacen_db}
    ports:
      - "127.0.0.1:5432:5432"   # solo accesible desde tu equipo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-almacen_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD. Copia .env.example como .env y define la contraseña}
      POSTGRES_DB: ${POSTGRES_DB:-almacen_db}
      POSTGRES_HOST: db
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_API_CLIENT_ID: ${AZURE_API_CLIENT_ID:-}
      AZURE_ALLOW_GUEST_USERS: ${AZURE_ALLOW_GUEST_USERS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Mexico_City}
    ports:
      - "8000:8000"

volumes:
  pgdata:
